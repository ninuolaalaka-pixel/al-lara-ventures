  <style>
    body {

<body>

  <body>
  <!-- HEADER -->
  <header>
    <div class="container">
      <nav style="display:flex; justify-content:space-between; align-items:center;">
        
      <!-- Logo + Text Container -->
       <div style="display:flex; align-items:center; gap:10px;">
  
  <!-- Logo Image -->
  <a href="index.html">
    <img src="images\Service Business Logo AL LARA VENTURES.png" alt="AL LARA VENTURES Logo" style="height:40px; width:auto;">

  <!-- Text -->

    <a href="index.html" class="logo-link">AL LARA VENTURES</a>
  </strong>
</div>

        <div style="display:flex; gap:20px; align-items:center;">
          <a href="index.html" class="nav-link">Home</a>
          <a href="uae-store.html" class="nav-link">Foodstuff (UAE)</a>

          <a href="cart.html" class="cart-link">
            🛒 <span id="cart-count">0</span>
          </a>
        </div>

      </nav>
    </div>
  </header>

  <div class="admin-wrapper">
  <!-- PASSWORD SCREEN -->
  <div id="lockscreen">
    <h3>Admin Access</h3>
    <input id="adminPass" type="password" placeholder="Enter password">
    <button onclick="unlock()">Enter</button>
  </div>

  <!-- MAIN CONTENT -->
  <div class="card" id="content" style="display:none;">
    <h2>Create Payment Link</h2>

    <input id="name" placeholder="Customer Name">
    <input id="email" placeholder="Customer Email">
    <input id="amount" placeholder="Amount (AED)" type="number">
    <input id="message" placeholder="Message (optional)">

    <button id="generate">Generate Payment Link</button>

    <div id="result"></div>
  </div>
  </div>

    <script>
    // The password is NOT stored in this page. The server checks it
    // (ADMIN_API_SECRET in Vercel), so viewing the source reveals nothing.
    let adminKey = "";

    function unlock() {
      const pass = document.getElementById("adminPass").value;
      if (!pass) return;
      adminKey = pass;
      document.getElementById("lockscreen").style.display = "none";
      document.getElementById("content").style.display = "block";
    }

    function relock(message) {
      adminKey = "";
      document.getElementById("adminPass").value = "";
      document.getElementById("content").style.display = "none";
      document.getElementById("lockscreen").style.display = "flex";
      alert(message);
    }

    // GENERATE PAYMENT LINK
    document.getElementById("generate").onclick = async () => {
      const name = document.getElementById("name").value;
      const email = document.getElementById("email").value;
      const amount = document.getElementById("amount").value;
      const message = document.getElementById("message").value;
      const result = document.getElementById("result");

      try {
        const res = await fetch("/api/create-payment-link", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "x-api-secret": adminKey
          },
          body: JSON.stringify({
            amount: Number(amount),
            customerName: name,
            customerEmail: email,
            message
          })
        });

        if (res.status === 401) return relock("Wrong password");
        if (res.status === 429) {
          result.textContent = "Too many attempts. Wait a minute and try again.";
          return;
        }

        const data = await res.json();
        result.textContent = "";

        if (data.success) {
          const link = document.createElement("a");
          link.href = data.url;
          link.target = "_blank";
          link.rel = "noopener";
          link.textContent = data.url;
          result.append("Payment Link:", document.createElement("br"), link);
        } else {
          result.textContent = "Error creating link.";
        }
      } catch (err) {
        result.textContent = "Network error. Please try again.";
      }
    };
  </script>

</body>
